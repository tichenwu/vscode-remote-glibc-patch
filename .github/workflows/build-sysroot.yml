name: Build VS Code Remote CTNG Sysroot
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cfg:
          - name: x86_64-gcc-8.5.0-glibc-2.28
            cfg_file: x86_64-gcc-8.5.0-glibc-2.28_new.config
            gnu_arch: x86_64
            ld: ld-linux-x86-64.so.2
          - name: aarch64-gcc-8.5.0-glibc-2.28
            cfg_file: aarch64-gcc-8.5.0-glibc-2.28.config
            gnu_arch: aarch64
            ld: ld-linux-aarch64.so.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install crosstool‑ng dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ gperf bison flex texinfo help2man make libncurses5-dev \
            python3-dev autoconf automake libtool libtool-bin gawk wget bzip2 \
            xz-utils unzip patch rsync curl ca-certificates

      - name: Build & install crosstool‑ng 1.26.0
        run: |
          wget -q http://crosstool-ng.org/download/crosstool-ng/crosstool-ng-1.26.0.tar.bz2
          tar -xjf crosstool-ng-1.26.0.tar.bz2
          cd crosstool-ng-1.26.0
          ./configure --prefix="$PWD/out"
          make -j "$(nproc)"
          make install
          echo "$PWD/out/bin" >> $GITHUB_PATH

      - name: Prepare ct‑ng workdir, use embedded config
        run: |
          mkdir -p ctng-work
          cp "configs/${{ matrix.cfg.cfg_file }}" ctng-work/.config

      - name: ct‑ng build
        working-directory: ctng-work
        run: ct-ng build

      - name: Extract runtime sysroot bundle
        id: extract
        run: |
          SRC="ctng-work/x-tools/${{ matrix.cfg.gnu_arch }}-linux-gnu/${{ matrix.cfg.gnu_arch }}-linux-gnu/sysroot"
          DEST="dist/sysroot-${{ matrix.cfg.name }}"
          mkdir -p "${DEST}/lib" "${DEST}/usr/lib"

          cp -a "${SRC}/lib/${{ matrix.cfg.ld }}" "${DEST}/lib/"
          cp -a \
            "${SRC}/lib/libc.so.6" \
            "${SRC}/lib/libpthread.so.0" \
            "${SRC}/lib/libdl.so.2" \
            "${SRC}/lib/libm.so.6" \
            "${SRC}/lib/librt.so.1" \
            "${DEST}/lib/"

          cp -a "${SRC}/usr/lib/libstdc++.so.6" "${DEST}/usr/lib/"

          TAR="sysroot-${{ matrix.cfg.name }}.tar.gz"
          tar -czf "${TAR}" -C "${DEST}" .
          echo "tar=${TAR}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cfg.name }}
          path: ${{ steps.extract.outputs.tar }}

      - name: Publish to Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sysroot-$(date +%Y%m%d-%H%M%S)
          name: Built CTNG Sysroot
          files: ${{ steps.extract.outputs.tar }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
