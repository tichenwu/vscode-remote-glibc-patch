name: Build CTNG Sysroot aarch64
on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

# 同一 workflow 的新推送会取消还在跑的旧构建，避免同 tag 竞争和浪费时长
concurrency:
  group: build-sysroot-aarch64
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Show disk
        run: df -h

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ gperf bison flex texinfo help2man make libncurses5-dev \
            python3-dev autoconf automake libtool libtool-bin gawk wget bzip2 \
            xz-utils unzip patch rsync curl ca-certificates

      - name: Build & install crosstool-ng 1.26.0
        run: |
          wget -q http://crosstool-ng.org/download/crosstool-ng/crosstool-ng-1.26.0.tar.bz2
          tar -xjf crosstool-ng-1.26.0.tar.bz2
          cd crosstool-ng-1.26.0
          ./configure --prefix="$PWD/out"
          make -j1
          make install
          echo "$PWD/out/bin" >> $GITHUB_PATH

      - name: Prepare workdir
        run: |
          mkdir -p ctng-work
          cp "configs/aarch64-gcc-8.5.0-glibc-2.28.config" ctng-work/.config
          # 如果你想保留 config 里 CT_PARALLEL_JOBS=6，注释掉下面这一行
          # sed -i 's|CT_PARALLEL_JOBS=.*|CT_PARALLEL_JOBS="1"|' ctng-work/.config

      - name: Cache source tarballs
        uses: actions/cache@v4
        with:
          path: ctng-work/downloads
          key: ctng-src-aarch64-gcc-8.5.0-glibc-2.28

      - name: ct-ng build
        working-directory: ctng-work
        run: |
          set -o pipefail
          ct-ng build 2>&1 | tee build.log

      - name: Dump ctng-work debug tree
        run: |
          ls -la ctng-work
          echo "=== looking for sysroot ==="
          find ctng-work -maxdepth 3 -type d -name sysroot

      - name: Sanity check sysroot exists
        run: |
          if ! find ctng-work -type d -name sysroot | grep -q .; then
            echo "FATAL: ct-ng build finished without producing sysroot"
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctng-buildlog-aarch64
          path: ctng-work/build.log

      - name: Extract sysroot bundle
        id: extract
        run: |
          SYSROOT=$(find ctng-work -type d -name sysroot | head -n1)
          if [[ -z "${SYSROOT}" ]]; then
            echo "ERROR: cannot locate sysroot"
            ls -laR ctng-work
            exit 1
          fi
          echo "Found sysroot: ${SYSROOT}"

          DEST="dist/sysroot-aarch64-gcc-8.5.0-glibc-2.28"
          mkdir -p "${DEST}/lib"

          # aarch64 基础 glibc
          # 注意：-L 必须带上！sysroot 里这些 .so 全是符号链接，
          # 不解引用的话 tar 包里只有悬空链接，压缩包只有几百 KB
          cp -aL \
            "${SYSROOT}/lib/ld-linux-aarch64.so.1" \
            "${SYSROOT}/lib/ld-2.28.so" \
            "${SYSROOT}/lib/libc.so.6" \
            "${SYSROOT}/lib/libpthread.so.0" \
            "${SYSROOT}/lib/libdl.so.2" \
            "${SYSROOT}/lib/libm.so.6" \
            "${SYSROOT}/lib/librt.so.1" \
            "${DEST}/lib/"

          # 动态查找 libstdc++.so.6，不再硬编码 usr/lib
          LIBSTDCXX=$(find "${SYSROOT}" -name "libstdc++.so.6" | head -n1)
          if [[ -z "${LIBSTDCXX}" ]]; then
            echo "ERROR: libstdc++.so.6 not found inside sysroot"
            exit 1
          fi
          cp -aL "${LIBSTDCXX}" "${DEST}/lib/"
          # 顺带把真实本体也拷过来（libstdc++.so.6.0.25）
          REAL_LIBSTDCXX=$(readlink -f "${LIBSTDCXX}")
          cp -aL "${REAL_LIBSTDCXX}" "${DEST}/lib/"

          # 校验：包内不允许存在符号链接（防止悬空链接混进产物）
          if find "${DEST}" -type l | grep -q .; then
            echo "ERROR: bundle contains symlinks:"
            find "${DEST}" -type l
            exit 1
          fi
          ls -la "${DEST}/lib"

          TAR="sysroot-aarch64-gcc-8.5.0-glibc-2.28.tar.gz"
          tar -czf "${TAR}" -C "${DEST}" .
          echo "tar=${TAR}" >> $GITHUB_OUTPUT

          # 完整 sysroot 包（几百 MB 级别，含头文件、静态库、全套库）
          # 这里保留符号链接（不加 -h）：链接目标都在包内，解压后有效，
          # 也是交叉编译 sysroot 的标准形态
          SYSROOT_DIR=$(basename "${SYSROOT}")
          FULL_TAR="sysroot-aarch64-gcc-8.5.0-glibc-2.28-full.tar.gz"
          tar -czf "${FULL_TAR}" -C "$(dirname "${SYSROOT}")" "${SYSROOT_DIR}"
          echo "full_tar=${FULL_TAR}" >> $GITHUB_OUTPUT
          ls -lh "${TAR}" "${FULL_TAR}"

      - name: Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sysroot-aarch64
          name: Built aarch64 CTNG Sysroot
          files: |
            ${{ steps.extract.outputs.tar }}
            ${{ steps.extract.outputs.full_tar }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
